name: Continuous Delivery (Release Artifact)


on:
  push:
    branches: [ "main" ]

jobs:
  build-and-release:
    name: Build & Upload Release Artifact
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build JAR Package with Maven
        run: mvn clean package -DskipTests

     
      - name: Get Version and Date
        id: vars
        run: |
          echo "version=v$(date +'%Y.%m.%d.%H%M%S')" >> $GITHUB_OUTPUT

      
      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/wattguard-*.jar
          tag_name: ${{ steps.vars.outputs.version }}
          name: Release ${{ steps.vars.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
